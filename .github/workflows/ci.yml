name: Neon Runner CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t neon-runner-backend ./backend

      - name: Build frontend image
        run: docker build -t neon-runner-frontend ./frontend

      - name: Save Docker images
        run: |
          docker save neon-runner-backend neon-runner-frontend \
            -o neon-runner-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: neon-runner-images
          path: neon-runner-images.tar

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: neon-runner-images

      - name: Load Docker images
        run: docker load -i neon-runner-images.tar

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neon-runner-backend
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neon-runner-frontend
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH